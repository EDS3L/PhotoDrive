name: Checks

# Reużywalny zestaw bramek jakości (workflow_call). Definicja testów/lintu żyje
# w JEDNYM miejscu i jest wołana przez:
#   - ci.yml      → pełne sprawdzenie gałęzi i PR (backend + frontend),
#   - publish.yml → gate deployu (od B.44 również backend + frontend, patrz komentarz tam).
# Flagi wejściowe zostają, bo pozwalają odpalić wyłącznie potrzebną część, ale oba
# wywołania używają dziś `true`/`true`.

on:
  workflow_call:
    inputs:
      backend:
        description: Uruchom testy backendu (Gradle + JaCoCo)
        type: boolean
        default: true
      frontend:
        description: Uruchom testy (Vitest) + lint + build frontu
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend — testy (Gradle + JaCoCo)
    if: ${{ inputs.backend }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # `check` = testy (jednostkowe + integracyjne) + jacocoTestCoverageVerification (próg 70% linii).
      # Samo `test` przepuszczało spadek pokrycia — bramka nie była nigdzie wołana.
      # Testy integracyjne (5.1) startują MySQL przez Testcontainers — runner `ubuntu-latest`
      # ma Dockera z pudełka, więc nie trzeba go tu instalować ani konfigurować.
      - name: Run tests + coverage gate
        working-directory: core
        run: ./gradlew check --no-daemon

  frontend-checks:
    name: Frontend — testy, lint & build
    if: ${{ inputs.frontend }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # Vitest + React Testing Library (jsdom). Czerwony test blokuje deploy tak samo
      # jak czerwony test backendu — inaczej testy frontu byłyby tylko dekoracją.
      # Świadomie `test:coverage`, a nie `test`: progi z `vite.config.ts` egzekwuje tylko
      # przebieg z pokryciem (5.5). Dokładnie ten sam podział co po stronie backendu,
      # gdzie bramką jest `gradlew check`, a nie `gradlew test`.
      - name: Run tests + coverage gate
        working-directory: frontend
        run: npm run test:coverage

      - name: Build
        working-directory: frontend
        run: npm run build
