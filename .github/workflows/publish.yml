name: Build, Publish and Deploy Docker Image

on:
  push:
    branches: [main, master]
    paths:
      - "core/src/main/**"
      - "core/Dockerfile"
      - "core/build.gradle"
      - "core/settings.gradle"
      - "core/gradle/**"
      - "docker-compose.prod.yml"
      - "frontend/src/**"
      - "frontend/Dockerfile"
      - "frontend/package.json"
      - "frontend/nginx.conf"
      - ".github/workflows/**"
  # Ręczny re-deploy bieżącego `main` bez sztucznego commita — potrzebny, gdy
  # trzeba odtworzyć obraz (awaria rejestru, ręczna zmiana na VPS, rollback).
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

# B.44: TU BYŁ JOB `changes` (dorny/paths-filter) I WARUNKI `if:` NA BUILDACH.
# Usunięte świadomie — path-filter liczy różnicę względem POPRZEDNIEGO PUSHA, a nie
# względem tego, co realnie stoi na produkcji. Przy serii pushy GitHub trzyma w kolejce
# tylko jeden oczekujący run (`cancel-in-progress: false`), więc push kasuje run
# oczekujący; jeśli tamten niósł zmianę backendu, następny (np. frontowy) widział
# `backend=false`, pomijał `build-backend` i deploy wypychał STARY obraz, meldując
# sukces. Zdarzyło się realnie 25.07 (fix B.43 przez chwilę nie istniał na prodzie).
# Teraz każdy przebieg testuje i buduje OBA stacki z HEAD-a, więc stan produkcji zawsze
# odpowiada wierzchołkowi `main`. Koszt jest mały: niezmieniony stack trafia w cache
# (Gradle/GHA + warstwy Dockera) i wypycha obraz o tym samym digeście.
jobs:
  # Bramka jakości: czerwone testy = brak builda i brak deployu (`needs: checks`).
  checks:
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml
    with:
      backend: true
      frontend: true

  build-backend:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./core/
          file: ./core/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/eds3l:photodrive
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend/
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/eds3l:photodrive-frontend
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # Oba buildy są teraz obowiązkowe, więc `needs` wystarcza — zniknął warunek
  # `always() && ...`, który istniał tylko po to, żeby deploy przeszedł przy
  # POMINIĘTYM buildzie. To on zamieniał brakujący obraz w „sukces" (B.44).
  deploy:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy docker-compose to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml"
          target: "/home/${{ secrets.USERNAME }}/photodrive"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        env:
          VPS_USERNAME: ${{ secrets.USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DATASOURCE_PASSWORD: ${{ secrets.DATASOURCE_PASSWORD }}
          DATASOURCE_URL: ${{ secrets.DATASOURCE_URL }}
          DATASOURCE_USERNAME: ${{ secrets.DATASOURCE_USERNAME }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          APP_DIR: ${{ secrets.DIR }}
          APP_TEMP: ${{ secrets.TEMP }}
          TOKEN_SECRETKEY: ${{ secrets.TOKEN_SECRETKEY }}
          JWT_ACCESS_TTL_MINUTES: ${{ secrets.JWT_ACCESS_TTL_MINUTES }}
          ORG_MAX_SIZE: ${{ secrets.ORG_MAX_SIZE }}
          SWAGGER_USER: ${{ secrets.SWAGGER_USER }}
          SWAGGER_PASSWORD: ${{ secrets.SWAGGER_PASSWORD }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: VPS_USERNAME,DOCKER_TOKEN,DOCKER_USERNAME,DATASOURCE_PASSWORD,DATASOURCE_URL,DATASOURCE_USERNAME,MAIL_HOST,MAIL_PASSWORD,MAIL_USERNAME,APP_DIR,APP_TEMP,TOKEN_SECRETKEY,JWT_ACCESS_TTL_MINUTES,ORG_MAX_SIZE,SWAGGER_USER,SWAGGER_PASSWORD

          script: |
            echo "$DOCKER_TOKEN" | docker login docker.io -u "$DOCKER_USERNAME" --password-stdin

            export DATASOURCE_PASSWORD="$DATASOURCE_PASSWORD"
            export DATASOURCE_URL="$DATASOURCE_URL"
            export DATASOURCE_USERNAME="$DATASOURCE_USERNAME"
            export MAIL_HOST="$MAIL_HOST"
            export MAIL_PASSWORD="$MAIL_PASSWORD"
            export MAIL_USERNAME="$MAIL_USERNAME"
            export DIR="$APP_DIR"
            export STORAGE_TEMP_PATH="$APP_TEMP"
            export TOKEN_SECRETKEY="$TOKEN_SECRETKEY"
            export JWT_ACCESS_TTL_MINUTES="$JWT_ACCESS_TTL_MINUTES"
            export ORG_MAX_SIZE="$ORG_MAX_SIZE"
            export SWAGGER_USER="$SWAGGER_USER"
            export SWAGGER_PASSWORD="$SWAGGER_PASSWORD"

            cd /home/$VPS_USERNAME/photodrive
            docker pull docker.io/$DOCKER_USERNAME/eds3l:photodrive
            docker pull docker.io/$DOCKER_USERNAME/eds3l:photodrive-frontend
            docker pull busybox:1.36

            docker compose -f docker-compose.prod.yml up -d --remove-orphans --pull never
